name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carancho
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carancho"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Dummy CI-only values. Nothing here is a real secret.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carancho
      PAYLOAD_SECRET: ci-only-payload-secret-not-used-anywhere-else
      PAYLOAD_DISABLE_BLOB_STORAGE: 'true'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from the packageManager field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # Payload pushes the schema to the empty database on first connect (push is on
      # outside production), so tests/int/api.int.spec.ts runs against a fresh schema.
      - name: Integration tests
        run: pnpm run test:int
